name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['10', '11', '12', '13']
        stability: [prefer-lowest, prefer-stable]
        exclude:
          - php: '8.2'
            laravel: '12'
          - php: '8.2'
            laravel: '13'
          - php: '8.3'
            laravel: '10'
            stability: prefer-lowest

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.stability }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Pin framework
        run: |
          set -euo pipefail
          case "${{ matrix.laravel }}" in
            10) TB="^8.36" ;;
            11) TB="^9.0" ;;
            12) TB="^10.0" ;;
            13) TB="^11.0" ;;
          esac
          composer require "laravel/framework:^${{ matrix.laravel }}.0" "orchestra/testbench:${TB}" --no-update --dev --no-interaction
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G

      - name: Pest
        run: vendor/bin/pest --colors=never

  filament:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '10'
            testbench: '^8.36'
            filament: '^3.2'
          - php: '8.3'
            laravel: '11'
            testbench: '^9.0'
            filament: '^3.2'
          - php: '8.4'
            laravel: '12'
            testbench: '^10.0'
            filament: '^4.0'
          - php: '8.4'
            laravel: '13'
            testbench: '^11.0'
            filament: '^4.0'

    name: Filament ${{ matrix.filament }} · Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install
        run: |
          composer require \
            "laravel/framework:^${{ matrix.laravel }}.0" \
            "orchestra/testbench:${{ matrix.testbench }}" \
            "filament/filament:${{ matrix.filament }}" \
            --no-update --dev --no-interaction
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Filament tests
        run: vendor/bin/pest --colors=never --group=filament
